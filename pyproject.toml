[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-graph-variant14"
version = "1.0.0"
description = "Versioned dependency graph for Python packages, stages 1-3"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
depviz = "depviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
